<div class="container mt-4">
  <h1>Programa chungo</h1>
  <div class="mb-3">
    <label for="exampleFormControlInput1" class="form-label">Introduzca un número:</label>
    <input type="number" class="form-control" id="exampleFormControlInput1" #inputnum />
  </div>
  <div>
    <button type="button" class="btn btn-primary" (click)="handleNum()">Nuevo número</button>
  </div>
  <h2>La suma acumulada es: {{ cont }}</h2>
</div>

<div class="container mt-4">
  <ul class="list-group">
    @for (e of arrNum; track $index) {
      <li class="list-group-item">
        <app-hijo-numero-component [numero]="e" (handleCont)="handleCont($event)" />
      </li>
    }
  </ul>
</div>
