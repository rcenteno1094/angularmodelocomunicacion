<a
  class="list-group-item list-group-item-action"
  data-bs-toggle="modal"
  [attr.data-bs-target]="'#' + index"
>
  {{ pelicula.Titulo }}
</a>

<div class="modal fade" id="{{ index }}" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ pelicula.Titulo }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p>{{ pelicula.Argumento }}</p>
        <p>Fecha de estreno: {{ pelicula.Fecha_Estreno }}</p>
        <p>Director: {{ pelicula.Director }}</p>
      </div>
      <div class="container">
        <div class="ratio ratio-16x9">
          <iframe [src]="youtubeUrl" title="YouTube video player" allowfullscreen> </iframe>
        </div>
      </div>
    </div>
  </div>
</div>
